[package]
name = "docfind_core"
version = "0.5.1"
edition = "2024"

[dependencies]
fst = { version = "0.4", features = ["levenshtein"] }
serde = { version = "1.0.228", features = ["derive"] }
# No default features: the default `heapless-cas` pulls in heapless 0.7, with
# nine unsound advisories, atomic-polyfill (unmaintained), and a yanked spin.
# The index uses no heapless type, and the encoding does not change.
postcard = { version = "1.1.3", default-features = false, features = ["alloc", "use-std"] }
fsst-rs = "0.5.4"
rake = { version = "0.3", optional = true }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
serde_json = "1.0.145"

[features]
cli = ["rake"]
# Extract each document's keywords on the current rayon pool. The index is
# the same with and without it. Not for the wasm target, which has no threads.
parallel = ["cli", "dep:rayon"]
wasm = []
native = []

[dev-dependencies.rake]
version = "0.3"
